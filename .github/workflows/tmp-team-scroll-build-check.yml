name: Temporary team scroll build check

on:
  push:
    branches:
      - fix/team-detail-scroll

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --ignore-scripts
      - run: npm run typecheck
      - run: npm run build
